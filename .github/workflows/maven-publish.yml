# This workflow will build a package using Maven and then publish it to GitHub packages when a release is published
# ("published", not "created": saving a draft release must not publish anything)
# For more information see: https://github.com/actions/setup-java/blob/main/docs/advanced-usage.md#apache-maven-with-a-settings-path

name: Maven Package

on:
  release:
    types: [published]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publishes this library; also reads dao4 from the registry of the dao repository

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        server-id: github # Value of the repositories/repository and distributionManagement/repository id fields of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # builds and tests the library before deploying it (deploy runs all earlier phases, including the tests)
    - name: Build and publish to GitHub Packages Apache Maven
      run: mvn -B -ntp deploy -s $GITHUB_WORKSPACE/settings.xml
      env:
        GITHUB_TOKEN: ${{ github.token }}
